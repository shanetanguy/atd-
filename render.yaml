services:
  - type: web
    name: atd-inspections
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: ATD_STAFF_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: atd-data
      mountPath: /var/data
      sizeGB: 1
